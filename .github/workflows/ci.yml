name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # The daemon ignores a CLI --option from a user outside trusted-users, so this goes in its nix.conf.
          extra_nix_config: |
            allow-import-from-derivation = true
      # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces, which breaks bwrap in clan's vars generators.
      - run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix flake check --option allow-import-from-derivation true
